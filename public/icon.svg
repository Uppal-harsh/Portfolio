<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Harsh Uppal portfolio icon</title>
  <desc id="desc">A gold halo around a dark monogram mark for Harsh Uppal.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="58%">
      <stop offset="0" stop-color="#f5c842" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#f5c842" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="90" y1="60" x2="430" y2="455" gradientUnits="userSpaceOnUse">
